<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
<title id="t">AirStack: 9 software products, 5 read from their own pages</title>
<desc id="d">AirStack's counts as deployed, and weekly registry downloads against each tool's own 4-week level, 29 Oct 2026 to 4 Nov 2026. https://airstack.bot</desc>
<style>
:root{--bg:#0A0A0B;--s1:#141416;--ink:#F5F5F7;--ink2:rgba(245,245,247,.62);--hair:rgba(255,255,255,.1);--up:#3DDC97;--dn:#FF6B5E;--acc:#FF4F00}
@media (prefers-color-scheme:light){:root{--bg:#FFFFFF;--s1:#F5F5F7;--ink:#0A0A0B;--ink2:rgba(10,10,11,.6);--hair:rgba(0,0,0,.1);--up:#0A8F5A;--dn:#D33A2C}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:var(--ink)}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}.sub,.lab,.foot{fill:var(--ink2)}.sub{font-size:15px}.lab{font-size:15px}.foot{font-size:13px}
.big{font-size:46px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tk{font-size:15px;font-variant-numeric:tabular-nums}.nm{font-weight:600}.up{fill:var(--up)}.dn{fill:var(--dn)}
.dot{fill:var(--acc)}.ring{fill:none;stroke:var(--acc);stroke-width:2;transform-origin:56px 47px}
.run{animation:run 16s linear infinite}
@keyframes run{to{transform:translateX(-832px)}}
@keyframes ping{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.6)}}.ring{animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){.run,.ring{animation:none}.ring{opacity:0}}
</style>
<rect width="1200" height="300" rx="20" fill="var(--bg)"/><rect x=".5" y=".5" width="1199" height="299" rx="19.5" fill="none" stroke="var(--hair)"/>
<circle class="ring" cx="56" cy="47" r="7"/><circle class="dot" cx="56" cy="47" r="7"/>
<text class="brand" x="74" y="55">AirStack</text><text class="sub" x="176" y="55">See the software market move · every claim linked to its source</text>
<text class="foot" x="1152" y="55" text-anchor="end">updated 5 Nov 2026 · airstack.bot</text>
<g transform="translate(48,150)"><text class="big" y="0">9</text><text class="lab" y="30">software products</text></g><g transform="translate(328,150)"><text class="big" y="0">3</text><text class="lab" y="30">organizations</text></g><g transform="translate(608,150)"><text class="big" y="0">5</text><text class="lab" y="30">read from their own pages</text></g><g transform="translate(888,150)"><text class="big" y="0">10</text><text class="lab" y="30">list prices, quoted</text></g>
<rect x="24" y="214" width="1152" height="62" rx="12" fill="var(--s1)"/>
<text class="foot" x="48" y="238">7-day downloads vs each tool's 4-week level · 29 Oct 2026 – 4 Nov 2026</text>
<clipPath id="c"><rect x="40" y="244" width="1120" height="28"/></clipPath>
<g clip-path="url(#c)"><g transform="translate(48,262)"><g class="run"><text x="0" y="0" class="tk"><tspan class="nm">Gamma Deploy</tspan><tspan dx="8" class="up">▲ +9.8%</tspan></text><text x="208" y="0" class="tk"><tspan class="nm">Delta Vector</tspan><tspan dx="8" class="up">▲ +3.2%</tspan></text><text x="416" y="0" class="tk"><tspan class="nm">Epsilon Router</tspan><tspan dx="8" class="up">▲ +1.5%</tspan></text><text x="642" y="0" class="tk"><tspan class="nm">Zeta Agent</tspan><tspan dx="8" class="dn">▼ -6.2%</tspan></text><g transform="translate(832,0)"><text x="0" y="0" class="tk"><tspan class="nm">Gamma Deploy</tspan><tspan dx="8" class="up">▲ +9.8%</tspan></text><text x="208" y="0" class="tk"><tspan class="nm">Delta Vector</tspan><tspan dx="8" class="up">▲ +3.2%</tspan></text><text x="416" y="0" class="tk"><tspan class="nm">Epsilon Router</tspan><tspan dx="8" class="up">▲ +1.5%</tspan></text><text x="642" y="0" class="tk"><tspan class="nm">Zeta Agent</tspan><tspan dx="8" class="dn">▼ -6.2%</tspan></text></g></g></g></g>
</svg>
